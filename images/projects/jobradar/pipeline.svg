<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-labelledby="t d">
  <title id="t">JobRadar pipeline</title>
  <desc id="d">Jobs are collected from 160+ sources, filtered by rules, ranked with embeddings and judged by a local LLM. Code then computes the final score for a dashboard, where tags teach a preference model and a button starts a headless AI agent.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#98979f"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#5eead4"/></marker>
    <style>
      text { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; fill: #f2f0ea; }
      .box { fill: #1a1a1e; stroke: rgba(255,255,255,0.22); stroke-width: 1.5; }
      .hot { fill: #24191a; stroke: #ff5a36; stroke-width: 2; }
      .h { font-size: 25px; font-weight: 700; text-anchor: middle; }
      .s { font-size: 18px; fill: #b4b3ba; text-anchor: middle; }
      .wire { stroke: #98979f; stroke-width: 2.5; fill: none; }
      .back { stroke: #5eead4; stroke-width: 2.5; fill: none; }
      .lab { font-size: 18px; fill: #5eead4; text-anchor: middle; }
      .tag { font-size: 16px; fill: #98979f; font-family: Consolas, Menlo, monospace; letter-spacing: 1px; }
    </style>
  </defs>
  <rect width="1200" height="640" fill="#0e0e11"/>

  <text class="tag" x="40" y="42">FROM THE WEB TO A RANKED LIST</text>
  <text class="tag" x="40" y="352">FROM THE LIST TO AN APPLICATION</text>

  <!-- row 1 -->
  <path class="wire" d="M250 150H292" marker-end="url(#a)"/>
  <path class="wire" d="M500 150H542" marker-end="url(#a)"/>
  <path class="wire" d="M750 150H792" marker-end="url(#a)"/>
  <!-- LLM to score -->
  <path class="wire" d="M1000 240V378" marker-end="url(#a)"/>
  <!-- score to dashboard -->
  <path class="wire" d="M880 470H782" marker-end="url(#a)"/>
  <!-- dashboard to agent -->
  <path class="wire" d="M530 470H372" marker-end="url(#a)"/>
  <!-- tags back to the embedding step -->
  <path class="back" d="M655 380V300H646V242" marker-end="url(#b)"/>

  <rect class="box" x="40" y="60" width="210" height="180" rx="14"/>
  <text class="h" x="145" y="118">Collect</text>
  <text class="s" x="145" y="152">160+ sources</text>
  <text class="s" x="145" y="178">13 adapters, incl. a</text>
  <text class="s" x="145" y="202">browser crawler</text>

  <rect class="box" x="295" y="60" width="205" height="180" rx="14"/>
  <text class="h" x="397" y="130">Filter</text>
  <text class="s" x="397" y="164">plain rules, no AI</text>

  <rect class="box" x="545" y="60" width="205" height="180" rx="14"/>
  <text class="h" x="647" y="118">Embed</text>
  <text class="s" x="647" y="152">rank jobs before</text>
  <text class="s" x="647" y="178">the expensive step</text>

  <rect class="box hot" x="795" y="60" width="365" height="180" rx="14"/>
  <text class="h" x="977" y="118">Local LLM verdict</text>
  <text class="s" x="977" y="152">qwen3:8b on Ollama returns JSON</text>
  <text class="s" x="977" y="178">checked against a schema, and</text>
  <text class="s" x="977" y="202">unsupported claims are dropped</text>

  <rect class="box" x="885" y="380" width="275" height="180" rx="14"/>
  <text class="h" x="1022" y="440">Score</text>
  <text class="s" x="1022" y="474">blended signals, with</text>
  <text class="s" x="1022" y="500">caps enforced in code</text>

  <rect class="box" x="535" y="380" width="245" height="180" rx="14"/>
  <text class="h" x="657" y="440">Dashboard</text>
  <text class="s" x="657" y="474">FastAPI and SQLite,</text>
  <text class="s" x="657" y="500">triage and tagging</text>

  <rect class="box" x="40" y="380" width="330" height="180" rx="14"/>
  <text class="h" x="205" y="440">Headless AI agent</text>
  <text class="s" x="205" y="474">tailors a CV and letter, with scoped</text>
  <text class="s" x="205" y="500">tools and a spending cap</text>

  <text class="lab" x="790" y="296">tags teach a logistic regression</text>
  <text class="s" x="451" y="452" style="font-size:16px">on request</text>
</svg>
